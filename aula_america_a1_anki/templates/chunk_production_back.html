<div class="shell"><div class="panel">
  <div class="header">
    <div class="meta">{{Unit}} · {{Lesson}}</div>
    <div class="badge">{{Category}}</div>
  </div>
  <div class="body">
    <div class="context">{{ContextZH}}</div>
    <div class="prompt">{{PromptZH}}</div>
  </div>
  <div class="answer_zone">
    <div class="spanish">{{Spanish}}</div>
    <div class="audio_row">{{Audio}}</div>
    <div class="subanswer">{{MeaningZH}}</div>
  </div>
  <div class="details">
    {{#UsageZH}}<div class="detail">
      <div class="detail_label">使用</div>
      <div class="detail_text">{{UsageZH}}</div>
    </div>{{/UsageZH}}
    {{#Pattern}}<div class="detail">
      <div class="detail_label">结构</div>
      <div class="detail_text">{{Pattern}}</div>
    </div>{{/Pattern}}
    {{#Note}}<div class="detail">
      <div class="detail_label">注意</div>
      <div class="detail_text">{{Note}}</div>
    </div>{{/Note}}
  </div>
  <div class="ai_note">AI 音频 · OpenAI cedar</div>
</div></div>
